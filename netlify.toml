# IMPORTANTE: el Prerendering NO se configura en este archivo.
# El prerendering legacy de Netlify esta DEPRECADO (dejo de funcionar en planes
# Free el 20-01-2026). Se usa la extension nueva "Prerender":
#   1. Si el prerendering legacy esta activado, desactivarlo en
#      Project configuration -> Build & deploy -> Post processing -> Prerendering.
#   2. Instalar la extension para el equipo: https://app.netlify.com/extensions/prerender
#   3. En el proyecto: Extensions -> Prerender -> Enable prerendering.
#   4. Volver a deployar el sitio (requerido para activarla).
# La extension necesita Node 20+; por eso existe el archivo .node-version del repo.
# Con eso los bots (AdsBot-Google, Googlebot, etc.) reciben el HTML ya renderizado
# y los usuarios siguen recibiendo la SPA normal.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/blog/juicio-particion-herederos-sin-acuerdo"
  to = "/blog/juicio-de-particion-herederos-sin-acuerdo"
  status = 301
  force = true

[[redirects]]
  from = "/blog/vender-casa-heredada-hermano-se-opone-particion"
  to = "/blog/juicio-de-particion-herederos-sin-acuerdo"
  status = 301
  force = true

[[redirects]]
  from = "/blog/posts/promesa-de-compraventa"
  to = "/blog/promesa-de-compraventa-incumplimiento"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/abogado-civil-puerto-montt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/abogado-familia-puerto-montt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/abogado-arriendo-puerto-montt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/abogado-insolvencia-puerto-montt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/abogado-corporativo-puerto-montt"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacidad"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
